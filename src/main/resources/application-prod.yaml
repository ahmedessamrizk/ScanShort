spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}/${PROD_DB}?sslmode=require&channel_binding=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

app:
  base-url: ${DEPLOY_URL}