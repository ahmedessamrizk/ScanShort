spring:
  datasource:
    # working on docker database
    #    url: jdbc:postgresql://localhost:${DB_PORT}/${POSTGRES_DB}
    #    username: ${POSTGRES_USER}
    #    password: ${POSTGRES_PASSWORD}

    # working on production database
    url: jdbc:postgresql://${DB_HOST}/${PROD_DB}?sslmode=require&channel_binding=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      # working on docker redis
      #      host: localhost
      #      port: ${REDIS_PORT:6379}

      # working on production redis
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

app:
  base-url: http://localhost:${APP_PORT}/