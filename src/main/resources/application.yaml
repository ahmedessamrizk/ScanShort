server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: ScanShort

  config:
    import: optional:file:.env[.properties]

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

  output:
    ansi:
      enabled: ALWAYS

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: "%clr(%d{HH:mm:ss}){faint}%clr(%5p){highlight}%clr([%15.15t]){faint}%clr(%-30logger{0}){cyan}%clr(:){faint} %m%n"

security:
  bearer-prefix: ${BEARER_PREFIX}
  secret-key: ${SECRET_KEY}
  expiration-token-time: ${EXPIRATION_TOKEN_TIME}
  salt-rounds: ${SALT_ROUNDS}
